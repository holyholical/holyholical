name: pacman contribution graph

on:
  # 03:17 UTC daily. Deliberately off the hour: GitHub queues everything
  # scheduled at :00 and those runs get delayed or dropped under load.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

# A scheduled run and a push run can otherwise race each other into the
# output branch and one clobbers the other.
concurrency:
  group: pacman-graph
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman
          hide_month_labels: 'false'

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
