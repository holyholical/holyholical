name: Update README, Pacman Graph, and Stats Card

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

# Prevent two instances of this workflow from pushing to main simultaneously.
concurrency:
  group: update-readme-and-graph
  cancel-in-progress: false

jobs:
  update_readme_and_graph:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Generate README
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/data" \
            -w /data \
            -e GITHUB_TOKEN=${{ secrets.PERSONAL_GITHUB_TOKEN }} \
            cyteon/markscribe \
            -write README.md templates/readme.tpl

      - name: Generate pacman contribution graphs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          if ! git diff --quiet; then
            git add README.md '**/*.svg'
            git commit -m "Update README and Pacman graph"

            # Make sure local main includes the latest remote changes.
            git fetch origin main
            git rebase origin/main

            # Push the rebased commit.
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
```
